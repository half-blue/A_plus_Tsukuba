services:
 my_sql:
   platform: linux/amd64
   image: mysql:8.4 # 本番 (Cloud SQL for MySQL 8.4) と同じ。Django 5.2 は MariaDB 10.0 に対応していない
   container_name: a_plus_tsukuba-db
   environment:
     MYSQL_PORT: 3306
     MYSQL_ROOT_PASSWORD: rootpass
     MYSQL_DATABASE: vhoi5_aplus_tsukuba
     TZ: Asia/Tokyo  
   ports:
     - 3307:3306 # To avoid port conflict, use 3307.
   # 文字コードとsql_modeを本番 (ConoHa から移したデータ) に合わせる
   # utf8mb4とsql_modeの設定は.env側（django側＝セッションスコープ変数）で行う
   command: mysqld --character-set-server=utf8mb3 --collation-server=utf8mb3_general_ci --sql_mode=""
   volumes:
     - data-volume:/var/lib/mysql
   healthcheck:
        test: mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD
   networks:
    - default
    - aplus-network
     
 web:
    build: .
    container_name: a_plus_tsukuba-web
    ports:
      - 8000:8000
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      my_sql:
        condition: service_healthy # wait db starting
    # プログラムフォルダをボリューム指定する
    ## .envファイルなどを考慮して、以下のフォルダのみを対象にする。
    volumes:
      - ./A_plus_Tsukuba:/a_plus_tsukuba/A_plus_Tsukuba
      - ./board:/a_plus_tsukuba/board
 
volumes:
 data-volume:

networks:
  aplus-network:
    external: true